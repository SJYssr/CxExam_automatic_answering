<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CxExam-AUTO</title>
    <style>
      html, body { overflow: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif; margin: 16px; }
      .row { margin-bottom: 12px; }
      label { display: inline-block; width: 140px; }
      .input-wrap { display: inline-block; position: relative; }
      input { width: 420px; padding: 6px 36px 6px 8px; border-radius: 10px; }
      .icon-in {
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        cursor: pointer; user-select: none; opacity: 0.75; font-size: 14px;
      }
      .icon-in:hover { opacity: 1; }
      #status { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; background: #f6f8fa; border: 1px solid #e1e4e8; padding: 10px; min-height: 25px; max-width: 450px; border-radius: 10px; overflow-y: auto; }
      button { padding: 8px 16px; margin-right: 12px; border-radius: 10px; }
      .info-row { display: flex; justify-content: center; gap: 16px; align-items: stretch; margin-bottom: 12px; }
      .notice-box { width: 220px; border: 1px solid #e1e4e8; border-radius: 10px; background: #ffffff; padding: 10px; font-size: 12px; color: #000000; line-height: 1.5; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02); }
      .notice-title { font-weight: bold; margin-bottom: 6px; text-align: center; }
      .notice-content { max-height: 120px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; scrollbar-width: none; -ms-overflow-style: none; }
      .notice-content::-webkit-scrollbar { display: none; }
      .disclaimer { font-size: 11px; color: #666; text-align: center; display: block; max-width: 360px; line-height: 1.4; padding: 10px; border: 1px solid #e1e4e8; border-radius: 10px; background: #f8f8f8; }
      .button-group { text-align: center; position: relative; }
      .update-tooltip {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        background: #333;
        color: #fff;
        border-radius: 6px;
        font-size: 12px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        z-index: 1000;
      }
      .update-tooltip.show {
        opacity: 1;
      }
      .update-tooltip::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 6px solid transparent;
        border-top-color: #333;
      }
      .version { text-align: center; font-size: 12px; color: #999; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="row">
      <label for="target">目标路径</label>
      <span class="input-wrap">
        <input id="target" placeholder="请选择CxExam.exe 文件路径" />
        <span id="iconChooseExe" class="icon-in" title="选择CxExam.exe">📁</span>
      </span>
    </div>
    <div class="row">
      <label for="card">密钥</label>
      <span class="input-wrap">
        <input id="card" type="password" placeholder="请输入密钥，如果没有请点击购买" />
        <span id="iconToggleCard" class="icon-in" title="显示/隐藏">😊</span>
      </span>
    </div>
    <div class="row">
      <label for="apikey">API Key</label>
      <span class="input-wrap">
        <input id="apikey" type="password" placeholder="请输入Deepseek API Key,具体操作请看使用说明" />
        <span id="iconToggleApikey" class="icon-in" title="显示/隐藏">😊</span>
      </span>
    </div>
    <div class="row">
      <label>登录状态</label>
      <div id="status"></div>
    </div>
    <div class="info-row">
      <div class="notice-box">
        <div class="notice-title">公告</div>
        <div class="notice-content" id="noticeBox">暂无公告</div>
      </div>
      <div class="disclaimer">免责声明：<br/>1.仅供学习交流使用，禁止用于非法用途<br/>2.他人或组织使用此工具进行的任何违法行为与作者无关<br/>3.使用本项目造成的任何后果由使用者自行承担<br/>4.您的付费为项目测试资格，您的一切行为与作者无关<br/>5.登陆/启动则代表您同意本声明</div>
    </div>
    <div class="row button-group">
      <button id="btnPurchase">购买</button>
      <button id="btnHelp">使用说明</button>
      <div style="position: relative; display: inline-block;">
        <div class="update-tooltip" id="updateTooltip">密码：6666</div>
        <button id="btnUpdate">更新</button>
      </div>
      <button id="btnLogin">登录</button>
      <button id="btnStart">启动</button>
    </div>
    <div class="version">---CxExam-AUTO-v1.0.8---</div>

    <script src="renderer.js"></script>
  </body>
  </html>
