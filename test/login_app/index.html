<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CxExam-AUTO-v1.0.4</title>
    <style>
      html, body { overflow: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif; margin: 16px; }
      .row { margin-bottom: 12px; }
      label { display: inline-block; width: 140px; }
      .input-wrap { display: inline-block; position: relative; }
      input { width: 420px; padding: 6px 36px 6px 8px; }
      .icon-in {
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        cursor: pointer; user-select: none; opacity: 0.75; font-size: 14px;
      }
      .icon-in:hover { opacity: 1; }
      #status { white-space: pre-wrap; background: #f6f8fa; border: 1px solid #e1e4e8; padding: 10px; min-height: 100px; border-radius: 6px; }
      button { padding: 8px 16px; }
    </style>
  </head>
  <body>
    <div class="row">
      <label for="target">目标路径</label>
      <span class="input-wrap">
        <input id="target" placeholder="请选择CxExam.exe 文件路径" />
        <span id="iconChooseExe" class="icon-in" title="选择可执行文件">📁</span>
      </span>
    </div>
    <div class="row">
      <label for="card">密钥</label>
      <span class="input-wrap">
        <input id="card" type="password" placeholder="请输入单码" />
        <span id="iconToggleCard" class="icon-in" title="显示/隐藏">😊</span>
      </span>
    </div>
    <div class="row">
      <label for="apikey">API Key</label>
      <span class="input-wrap">
        <input id="apikey" type="password" placeholder="请输入密钥" />
        <span id="iconToggleApikey" class="icon-in" title="显示/隐藏">😊</span>
      </span>
    </div>
    <div class="row">
      <label>登录状态</label>
      <div id="status"></div>
    </div>
    <div class="row">
      <button id="btnLogin">登录</button>
      <button id="btnStart">启动</button>
    </div>

    <script src="renderer.js"></script>
  </body>
  </html>
